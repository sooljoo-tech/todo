# PC 설치파일(Windows) + 안드로이드 위젯 APK 빌드 → GitHub Release 에 첨부
# 실행: 태그 push (v0.1.0 등) 또는 Actions 탭에서 수동 실행
name: 앱 빌드

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/release/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: APK 빌드
        working-directory: widgets/android
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          APP_URL: https://${{ github.repository_owner }}.github.io/todo/
        run: gradle assembleDebug --no-daemon
      - run: cp widgets/android/app/build/outputs/apk/debug/app-debug.apk todo-widget.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: todo-widget.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/windows/*.exe
            out/android/todo-widget.apk
          generate_release_notes: true
