# 10분마다 실행 → 설정 시각(한국시간)이 지났고 오늘 아직 못 받은 사용자에게 푸시 발송
# (GitHub 예약 실행은 몇 분 늦어질 수 있어, 시각 일치가 아닌 "지났는지 + 오늘 보냈는지"로 판단)
name: 아침 알림 발송

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '테스트: 전 구독자에게 즉시 발송'
        type: boolean
        default: false

concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: scripts/package-lock.json }
      - run: npm ci
        working-directory: scripts
      - run: node send-daily-push.mjs
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          APP_URL: https://${{ github.repository_owner }}.github.io/todo/
          FORCE: ${{ inputs.force }}
